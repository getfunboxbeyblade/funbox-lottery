<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Funbox 戰鬥陀螺 LINE 抽選門市導覽：依北、桃竹苗、中部、南部、東部分類，定位最近門市並一鍵加入 LINE。"
    />
    <title>Funbox LINE 抽選門市</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <div class="header-row">
          <div>
            <p class="kicker">BEYBLADE DRAW · 本週開抽</p>
            <h1>Funbox LINE 抽選門市</h1>
            <p class="lede">
              依地區找到最近的 Funbox 門市，加入官方 LINE，或直接進入各店陀螺抽選。
            </p>
            <p class="event-chip" id="event-chip" aria-hidden="true">9/4 – 9/5 抽選進行中</p>
          </div>
          <div class="header-actions">
            <button id="sync-btn" class="sync-btn" type="button">更新抽選資料</button>
            <p id="sync-meta" class="sync-meta">資料更新：尚未同步</p>
            <button id="locate-btn" class="locate-btn" type="button">定位最近門市</button>
          </div>
        </div>
        <nav id="page-nav" class="page-nav" aria-label="功能"></nav>
        <p class="note">
          非官方整理。點過的選項會記住並變灰色；活動以各店粉專與 LINE 公告為準。
        </p>
      </div>
    </header>

    <main class="wrap">
      <div class="toolbar">
        <label class="search-wrap">
          <span class="sr-only">搜尋門市</span>
          <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="7" cy="7" r="4.25" fill="none" stroke="currentColor" stroke-width="1.4" />
            <path d="M10.4 10.4 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" />
          </svg>
          <input
            id="search"
            class="search-input"
            type="search"
            placeholder="搜尋店名或商場，例如：板橋・LaLaport・漢神"
          />
        </label>
        <nav id="region-filters" class="region-nav" aria-label="地區"></nav>
      </div>

      <div class="status-row">
        <p id="status" class="status"></p>
        <div id="draw-list-actions" class="draw-list-actions" hidden>
          <button type="button" id="incomplete-toggle" data-incomplete-toggle>只看未抽完</button>
          <span class="draw-list-actions-sep" aria-hidden="true">·</span>
          <button type="button" data-fold="expand">全部展開</button>
          <button type="button" data-fold="collapse">全部收合</button>
        </div>
      </div>
      <div id="store-list"></div>
      <p id="empty" class="empty" hidden>沒有符合的門市，試試其他關鍵字或切換區域。</p>
    </main>

    <footer class="site-footer">
      <p class="footer-credit">作者 Frank CHU · 非官方</p>
      <p class="footer-updated">最後修改 <time datetime="2026-09-03T21:21:00+08:00">2026/09/03 21:21</time></p>
    </footer>

    <button id="back-top" class="back-top" type="button" aria-label="回到頂部">
      <span aria-hidden="true">↑</span>
    </button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
